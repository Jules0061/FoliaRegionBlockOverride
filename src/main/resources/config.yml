settings:
  debug: false

defaults:
  despawn-time: 5s
  allow-break: true

blacklist:
  spawn:
    enabled: true
    blocks:
      - COBWEB

regions:
  ffa:
    enabled: true
    blocks:
      # Multiple blocks can share the same rule by separating them with commas.
      COBWEB,WATER:
        despawn-time: 200s
        allow-break: true

  swordzone:
    enabled: true
    blocks:
      COBWEB:
        despawn-time: 5s
        allow-break: true

  arena:
    enabled: true
    blocks:
      COBWEB:
        despawn-time: 3s
        allow-break: true
      POWDER_SNOW:
        despawn-time: 10s
        allow-break: false
      SLIME_BLOCK:
        despawn-time: 30s
        allow-break: true
