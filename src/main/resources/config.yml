settings:
  debug: false

defaults:
  despawn-time: 5s
  allow-break: true
  # When true, players in a region may only break blocks that players placed;
  # natural terrain is protected. Can be overridden per region below.
  only-break-player-placed: false

blacklist:
  spawn:
    enabled: true
    blocks:
      - COBWEB

regions:
  ffa:
    enabled: true
    # Players can only break blocks that were placed by players in this region.
    only-break-player-placed: true
    blocks:
      # Multiple blocks can share the same rule by separating them with commas.
      COBWEB,WATER:
        despawn-time: 5s
        allow-break: true
      STONE,OBSIDIAN,BLUE_ICE,STONE_PRESSURE_PLATE,STONE_BUTTON:
        despawn-time: 30s
        allow-break: true

  swordzone:
    enabled: true
    blocks:
      COBWEB:
        despawn-time: 5s
        allow-break: true

  arena:
    enabled: true
    blocks:
      COBWEB:
        despawn-time: 3s
        allow-break: true
      POWDER_SNOW:
        despawn-time: 10s
        allow-break: false
      SLIME_BLOCK:
        despawn-time: 30s
        allow-break: true
